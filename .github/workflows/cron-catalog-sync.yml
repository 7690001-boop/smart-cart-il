name: Catalog Sync

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger catalog sync
        env:
          INGESTION_API_KEY: ${{ secrets.INGESTION_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "x-api-key: $INGESTION_API_KEY" \
            "$APP_URL/api/cron/catalog-sync")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "$body"
          [ "$status" -eq 200 ] || exit 1
